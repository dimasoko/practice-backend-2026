services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - src/.env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: survey_api
      DB_USERNAME: root
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: survey_api
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10